<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>モツモツクライシス</title>
    <style>
        :root { --bg-color: #1a0000; --gold: #fff000; }
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: var(--bg-color);
            color: white;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #game-wrapper {
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        #game-screen {
            position: relative;
            width: 360px;
            height: 500px;
            background: #222;
            border: 4px solid #440000;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 10px;
        }
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s; z-index: 1; pointer-events: none;
        }
        .bg-active { opacity: 1; }
        #bg-danger {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.25);
            opacity: 0; transition: opacity 0.3s; z-index: 2; pointer-events: none;
        }
        .danger-active { opacity: 1 !important; animation: pulseDanger 0.8s infinite alternate; }
        @keyframes pulseDanger { 0% { opacity: 0.2; } 100% { opacity: 0.6; } }

        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: red; opacity: 0; pointer-events: none; z-index: 50;
            transition: opacity 0.2s;
        }
        #player {
            position: absolute; bottom: 10px; width: 70px; height: 70px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 10;
        }
        .falling-item {
            position: absolute; width: 50px; height: 50px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 5;
        }
        .fast-mode { filter: drop-shadow(0 0 10px #ff0000) brightness(1.3); }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .crisis-title-container { margin-bottom: 5px; perspective: 500px; }
        .title-part { font-family: 'Arial Black', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; display: block; line-height: 0.8; }
        .title-motsu { font-size: 40px; color: #fff; text-shadow: 0 2px 0 #888, 0 4px 5px rgba(0,0,0,0.5); }
        .title-crisis { font-size: 44px; color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        
        .how-to-play { font-size: 10px; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 8px; margin: 5px 0; border: 1px solid #444; width: 95%; line-height: 1.3; text-align: left; }
        .how-to-play b { color: #ff0; }
        
        .selector-label { font-size: 13px; margin-top: 3px; color: #ccc; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 5px; }
        .mode-btn { padding: 4px 12px; background: #333; border: 2px solid #555; color: #fff; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .mode-btn.selected { border-color: #ff0000; background: #600; }

        .char-selector { display: flex; gap: 8px; margin: 3px 0; }
        .char-btn { width: 45px; height: 45px; border: 3px solid #555; border-radius: 10px; background-size: cover; background-repeat: no-repeat; background-position: center; background-color: rgba(255,255,255,0.1); cursor: pointer; }
        .char-btn.selected { border-color: #ff0000; background-color: rgba(255,0,0,0.3); box-shadow: 0 0 10px #ff0000; }

        .sound-switch { background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; margin-bottom: 5px; border: 1px solid #777; font-size: 11px; cursor: pointer; }
        .action-btn { padding: 10px 25px; font-size: 18px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: #aa0000; border-bottom: 4px solid #660000; outline: none; }
        
        #ui-layer { position: absolute; top: 8px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; pointer-events: none; font-size: 13px; }
        .controls-row { display: flex; gap: 15px; align-items: center; margin-top: 10px; }
        .btn { width: 100px; height: 65px; font-size: 26px; color: white; background: #880000; border: none; border-bottom: 5px solid #440000; border-radius: 12px; cursor: pointer; touch-action: none; outline: none; }
        .pause-btn { width: 75px; height: 65px; font-size: 13px; background: #555; border-bottom-color: #333; }
        #result-screen { display: none; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-screen">
            <!-- 背景レイヤー (30秒ごとに自動切替) -->
            <div id="bg-container">
                <div class="bg-layer bg-active" style="background: #111;"></div>
                <div class="bg-layer" style="background: #1a0f00;"></div>
                <div class="bg-layer" style="background: #001a1a;"></div>
                <div class="bg-layer" style="background: #1a001a;"></div>
            </div>
            <div id="bg-danger"></div>
            <div id="damage-flash"></div>

            <!-- タイトル画面 -->
            <div id="title-screen" class="overlay">
                <div class="crisis-title-container">
                    <span class="title-part title-motsu">モツモツ</span>
                    <span class="title-part title-crisis">クライシス</span>
                </div>
                <div id="best-info" style="font-size:12px; margin-bottom:3px; color:var(--gold);">
                    最高記録: <span id="best-score-text">0</span> 点 (<span id="best-shogo-text">いちげんさん</span>)
                </div>
                <div class="how-to-play">
                    ・左右移動でモツをキャッチせよ！<br>
                    ・<b>赤オーラ</b>: 3倍速個体（50点） / <b>梅割り</b>: 体力回復<br>
                    ・<b>ビール瓶・靴</b>: ダメージ（コンボは途切れません）<br>
                    ・<b>連続獲得</b>: 10個ごとにボーナス +5Pt 加算！
                </div>
                <div class="selector-label">難易度：</div>
                <div class="mode-selector">
                    <button class="mode-btn" id="mode-easy" onclick="selectMode('easy')">イージー</button>
                    <button class="mode-btn selected" id="mode-hard" onclick="selectMode('hard')">ハード</button>
                </div>
                <div class="selector-label">呑んべぇ（キャラクター）：</div>
                <div class="char-selector">
                    <div class="char-btn selected" id="btn-A" onclick="selectChar('A')" style="background-color: #c0392b;">A</div>
                    <div class="char-btn" id="btn-B" onclick="selectChar('B')" style="background-color: #27ae60;">B</div>
                    <div class="char-btn" id="btn-C" onclick="selectChar('C')" style="background-color: #2980b9;">C</div>
                    <div class="char-btn" id="btn-D" onclick="selectChar('D')" style="background-color: #8e44ad;">D</div>
                </div>
                <div class="sound-switch" onclick="toggleSound()">音設定: <span class="sound-status-text">ON</span></div>
                <button class="action-btn" onclick="startGame()">宴 開始</button>
            </div>

            <!-- リザルト画面 -->
            <div id="result-screen" class="overlay">
                <h1 style="color:#ff0000; font-size:36px; margin:0 0 10px 0;">宴 終 了</h1>
                <div id="final-score" style="font-size:22px; margin:10px 0; color:var(--gold);">0 点</div>
                <div id="final-shogo" style="font-size:16px; margin-bottom:15px; font-weight:bold;">称号: いちげんさん</div>
                <button class="action-btn" style="width:220px;" onclick="location.reload()">もう一杯！（戻る）</button>
            </div>

            <!-- ゲーム中UI -->
            <div id="ui-layer">
                <div id="hp-display">体力: ❤️❤️❤️</div>
                <div id="score-board">0点</div>
                <div id="chain-display">連続: 0</div>
            </div>

            <div id="player"></div>
        </div>

        <!-- 操作ボタン -->
        <div class="controls-row">
            <button class="btn" onpointerdown="moveLeft()" onpointerup="stopMove()" onpointercancel="stopMove()">◀</button>
            <button class="btn pause-btn" id="btn-pause" onclick="togglePause()">一時停止</button>
            <button class="btn" onpointerdown="moveRight()" onpointerup="stopMove()" onpointercancel="stopMove()">▶</button>
        </div>
    </div>

    <script>
        // --- 状態・設定変数 ---
        let soundEnabled = true, isPaused = false, isGameRunning = false;
        let selectedChar = 'A', selectedMode = 'hard';
        let score = 0, hp = 3, chain = 0, playerX = 145;
        let moveDir = 0, playerSpeed = 7;
        let gameInterval = null, timerTicks = 0;
        let items = [];
        let currentBgIndex = 0, bgTimer = 0;

        // 音声合成・エフェクト用 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function selectMode(m) {
            selectedMode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`mode-${m}`).classList.add('selected');
        }

        function selectChar(type) {
            selectedChar = type;
            document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`btn-${type}`).classList.add('selected');
            playTone(440, 'sine', 0.1);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.querySelectorAll('.sound-status-text').forEach(el => el.innerText = soundEnabled ? "ON" : "OFF");
        }

        function togglePause() {
            if (!isGameRunning) return;
            isPaused = !isPaused;
            const btn = document.getElementById('btn-pause');
            btn.innerText = isPaused ? "再開" : "一時停止";
        }

        function moveLeft() { moveDir = -1; }
        function moveRight() { moveDir = 1; }
        function stopMove() { moveDir = 0; }

        function startGame() {
            isGameRunning = true;
            document.getElementById('title-screen').style.display = 'none';
            
            // プレイヤーの見た目設定（カラー簡易表現）
            const colors = { A: '#c0392b', B: '#27ae60', C: '#2980b9', D: '#8e44ad' };
            const pEl = document.getElementById('player');
            pEl.style.backgroundColor = colors[selectedChar] || '#fff';
            pEl.style.borderRadius = '50%';

            loadBestScore();
            gameInterval = setInterval(updateGame, 20);
        }

        function loadBestScore() {
            const bScore = localStorage.getItem('motu_best_score') || 0;
            document.getElementById('best-score-text').innerText = bScore;
            document.getElementById('best-shogo-text').innerText = getShogo(bScore);
        }

        function getShogo(sc) {
            if (sc >= 15000) return 'レジェンド';
            if (sc >= 5000) return '常連さん';
            if (sc >= 2500) return 'お客さん';
            if (sc >= 1000) return '御新規さん';
            return 'いちげんさん';
        }

        // --- 独立抽選システム ---
        function handleSpawns() {
            const intervalMotsu = selectedMode === 'hard' ? 35 : 55;
            const intervalEnemy = selectedMode === 'hard' ? 70 : 100;
            const intervalHeal = 400; // 稀に出現する梅割り

            if (timerTicks % intervalMotsu === 0) {
                // モツ＆3倍速個体の独立抽選
                const isFast = Math.random() < 0.2; // 20%で3倍速
                spawnItem(isFast ? 'motsu_fast' : 'motsu');
            }
            if (timerTicks % intervalEnemy === 0) {
                // 敵の独立抽選（ビール瓶 or 片方の靴）
                const enemyType = Math.random() < 0.5 ? 'beer' : 'shoe';
                spawnItem(enemyType);
            }
            if (timerTicks % intervalHeal === 0) {
                // 回復（梅割り）
                spawnItem('umewari');
            }
        }

        function spawnItem(type) {
            const screen = document.getElementById('game-screen');
            const itemEl = document.createElement('div');
            itemEl.className = 'falling-item';
            
            let speed = 3.5;
            if (type === 'motsu_fast') { speed = 10.5; itemEl.classList.add('fast-mode'); }
            if (type === 'beer') speed = 8.0; // 垂直高速
            if (type === 'shoe') speed = 6.5; // 揺れながら高速

            const x = Math.random() * 310;
            itemEl.style.left = x + 'px';
            itemEl.style.top = '-50px';

            // 見た目の設定（記号・カラー）
            if (type.startsWith('motsu')) {
                itemEl.style.background = '#f1c40f';
                itemEl.style.borderRadius = '30%';
            } else if (type === 'beer') {
                itemEl.style.background = '#d35400';
                itemEl.style.clipPath = 'polygon(30% 0%, 70% 0%, 70% 100%, 30% 100%)';
            } else if (type === 'shoe') {
                itemEl.style.background = '#7f8c8d';
                itemEl.style.borderRadius = '10px 10px 0 0';
            } else if (type === 'umewari') {
                itemEl.style.background = '#e74c3c';
                itemEl.style.borderRadius = '50%';
                itemEl.style.boxShadow = '0 0 10px #ff0';
            }

            screen.appendChild(itemEl);
            items.push({ el: itemEl, x: x, y: -50, type: type, speed: speed, wobble: Math.random() * 10 });
        }

        function updateGame() {
            if (isPaused) return;
            timerTicks++;

            // 背景切り替え（30秒 = 1500フレーム @ 20ms）
            bgTimer++;
            if (bgTimer >= 1500) {
                bgTimer = 0;
                currentBgIndex = (currentBgIndex + 1) % 4;
                document.querySelectorAll('.bg-layer').forEach((el, idx) => {
                    el.classList.toggle('bg-active', idx === currentBgIndex);
                });
            }

            // 独立抽選スポーン
            handleSpawns();

            // プレイヤー移動
            playerX += moveDir * playerSpeed;
            if (playerX < 0) playerX = 0;
            if (playerX > 290) playerX = 290;
            document.getElementById('player').style.left = playerX + 'px';

            // アイテム移動・判定処理
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                
                // 靴の揺れ動作
                if (it.type === 'shoe') {
                    it.wobble += 0.1;
                    it.x += Math.sin(it.wobble) * 2;
                }
                it.el.style.top = it.y + 'px';
                it.el.style.left = it.x + 'px';

                // キャッチ判定 (y: 410〜470付近)
                if (it.y > 410 && it.y < 470 && it.x + 40 > playerX && it.x < playerX + 50) {
                    if (it.type === 'motsu' || it.type === 'motsu_fast') {
                        // モツ獲得
                        let addScore = (it.type === 'motsu_fast') ? 50 : 10;
                        chain++;
                        // 10個ごとにボーナス +5ポイント
                        let bonus = Math.floor(chain / 10) * 5;
                        score += addScore + bonus;
                        playTone(600 + (chain * 5), 'square', 0.08);
                    } else if (it.type === 'umewari') {
                        // 梅割り（回復）
                        hp = Math.min(3, hp + 1);
                        score += 200;
                        playTone(880, 'sine', 0.2);
                    } else if (it.type === 'beer' || it.type === 'shoe') {
                        // ダメージ（※仕様通り、スルーしてもコンボは途切れないが、当たるとダメージ）
                        hp--;
                        triggerDamageFlash();
                        playTone(150, 'sawtooth', 0.2);
                        if (hp <= 0) {
                            gameOver();
                            return;
                        }
                    }
                    it.el.remove();
                    items.splice(i, 1);
                    updateUI();
                } 
                // 画面外に落ちた場合
                else if (it.y > 500) {
                    if (it.type === 'motsu' || it.type === 'motsu_fast') {
                        // モツを逃した場合のみ連続獲得カウントリセット
                        chain = 0;
                    }
                    // ※重要: ビール瓶や靴をスルーしてもコンボはリセットされない
                    it.el.remove();
                    items.splice(i, 1);
                    updateUI();
                }
            }
        }

        function triggerDamageFlash() {
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = '0.7';
            setTimeout(() => flash.style.opacity = '0', 200);
        }

        function updateUI() {
            document.getElementById('score-board').innerText = score + '点';
            document.getElementById('chain-display').innerText = '連続: ' + chain;
            
            let hearts = '';
            for (let i = 0; i < hp; i++) hearts += '❤️';
            document.getElementById('hp-display').innerText = '体力: ' + hearts;

            // 体力1での危険背景演出 (background_danger)
            const dangerEl = document.getElementById('bg-danger');
            if (hp === 1) {
                dangerEl.classList.add('danger-active');
            } else {
                dangerEl.classList.remove('danger-active');
            }
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            items.forEach(it => it.el.remove());
            items = [];

            // ハイスコア保存
            const best = localStorage.getItem('motu_best_score') || 0;
            if (score > best) {
                localStorage.setItem('motu_best_score', score);
            }

            document.getElementById('final-score').innerText = score + ' 点';
            document.getElementById('final-shogo').innerText = '称号: ' + getShogo(score);
            document.getElementById('result-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
