    <style>

        /* --- ゲームオーバーモーダル --- */
        #game-over-modal {
            display: none;

        #modal-card {

<body>

    <h1>モツゲーム ツルへの道</h1>

    <div id="game-container">
        <div id="ui-layer">

                <span style="font-size: 11px; color:#f39c12;">SCORE</span><br>

            </div>
        </div>

        <div id="canvas-container">
            <canvas id="game-canvas" width="400" height="560"></canvas>

            <!-- ゲームオーバー表示エリア -->
            <div id="game-over-modal">
                <div id="modal-card">
                    <div id="modal-title">精算完了</div>
                    <div id="modal-score-label">FINAL SCORE</div>
                    <div id="modal-score-val">0</div>

                    <!-- 作成実績カウント -->
                    <div class="result-counts">
                        <div class="result-row">
                            <span class="result-label">
                                <span class="badge-icon" style="background-color: #1abc9c;"></span>
                                ツル（最大）
                            </span>
                            <span id="tsuru-count" class="result-val">0個</span>
                        </div>
                        <div class="result-row">
                            <span class="result-label">
                                <span class="badge-icon" style="background-color: #ffaaa6;"></span>
                                コブクロ
                            </span>
                            <span id="kobukuro-count" class="result-val">0個</span>
                        </div>
                        <div class="result-row">
                            <span class="result-label">
                                <span class="badge-icon" style="background-color: #f8a5c2;"></span>
                                テッポウ
                            </span>
                            <span id="teppou-count" class="result-val">0個</span>
                        </div>
                        <div class="result-row">
                            <span class="result-label">
                                <span class="badge-icon" style="background-color: #b33939;"></span>
                                カシラ
                            </span>

                        </div>

        <div class="controls-row">

            <button id="end-btn" class="btn-style" onclick="gameOverAction()">精算（終了）</button>
        </div>

<script>
// ==========================================
// Web Audio API による自作サウンド合成エンジン
// ==========================================
let audioCtx = null;
let isSoundEnabled = false;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function toggleSound() {
    initAudio();
    isSoundEnabled = !isSoundEnabled;
    const btn = document.getElementById("sound-btn");
    
    if (isSoundEnabled) {
        btn.innerText = "BGM: ON";
        btn.style.background = "#27ae60";
        startBGM();
    } else {
        btn.innerText = "BGM: OFF";
        btn.style.background = "#7f8c8d";
        stopBGM();
    }
}

function playDropSound() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
}

function playMergeSound(level) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const baseFreq = 260 + level * 35;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sine";
    osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.08);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.8, audioCtx.currentTime + 0.18);
    
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

function playGameOverSound() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.6);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
}

let bgmInterval = null;
function startBGM() {
    if (!isSoundEnabled || bgmInterval) return;
    
    const notes = [220, 247.5, 264, 293.66, 330, 352, 396, 440];
    let step = 0;

    bgmInterval = setInterval(() => {
        if (!audioCtx || !isSoundEnabled) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        const note = notes[step % notes.length];
        osc.type = "triangle";
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
        
        step++;
    }, 250);
}

function stopBGM() {
    if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
    }
}

// ==========================================
// 【モツ定義データ】
// ==========================================
const MOTSU_TYPES = [
    { name: "シロ",     radius: 13, color: "#f5f6fa", score: 1,  image: "images/shiro.png" },
    { name: "レバ",     radius: 19, color: "#8b1e0f", score: 3,  image: "images/reba.png" },
    { name: "ガツ",     radius: 26, color: "#f5cd79", score: 6,  image: "images/gatsu.png" },
    { name: "アブラ",   radius: 34, color: "#fff200", score: 10, image: "images/abura.png" },
    { name: "ナンコツ", radius: 42, color: "#bdc3c7", score: 15, image: "images/nankotsu.png" },
    { name: "ハツ",     radius: 51, color: "#d63031", score: 21, image: "images/hatsu.png" },
    { name: "タン",     radius: 61, color: "#e17055", score: 28, image: "images/tan.png" },
    { name: "カシラ",   radius: 71, color: "#b33939", score: 36, image: "images/kashira.png" },
    { name: "テッポウ", radius: 82, color: "#f8a5c2", score: 45, image: "images/teppou.png" },
    { name: "コブクロ", radius: 93, color: "#ffaaa6", score: 55, image: "images/kobukuro.png" },
    { name: "ツル",     radius: 105, color: "#1abc9c", score: 66, image: "images/tsuru.png" }
];

const cacheBuster = Date.now();
MOTSU_TYPES.forEach(matsu => {
    if (matsu.image) {
        const img = new Image();
        img.src = matsu.image + "?v=" + cacheBuster;
        matsu.imgElement = img;
    }
});

const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;

const engine = Engine.create({ 
    gravity: { y: 1.0 },
    constraintIterations: 4 
});
const world = engine.world;

const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next-canvas");
const nextCtx = nextCanvas.getContext("2d");

const WIDTH = 400;
const HEIGHT = 560;
const DEAD_LINE = 95; 

let score = 0;
let tsuruCreatedCount = 0;   // ツルの作成カウント
let kobukuroCreatedCount = 0; // コブクロの作成カウント
let teppouCreatedCount = 0;  // テッポウの作成カウント
let kashiraCreatedCount = 0; // カシラの作成カウント

let currentMotsuIndex = getRandomMotsuIndex();
let nextMotsuIndex = getRandomMotsuIndex();
let isReadyToDrop = true;
let previewX = WIDTH / 2;
let gameOver = false;

const MOTSU_PHYSICS = {
    restitution: 0.18, 
    friction: 0.08,    
    density: 0.001
};

const wallOptions = { isStatic: true, friction: 0.1, render: { visible: false } };
const ground = Bodies.rectangle(WIDTH / 2, HEIGHT + 40, WIDTH + 100, 80, wallOptions);
const leftWall = Bodies.rectangle(-40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
const rightWall = Bodies.rectangle(WIDTH + 40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
Composite.add(world, [ground, leftWall, rightWall]);

const runner = Runner.create();
Runner.run(runner, engine);

function init() {
    buildEvolutionGuide();
    drawNext();
    requestAnimationFrame(renderLoop);
}

function getRandomMotsuIndex() {
    return Math.floor(Math.random() * 5);
}

function buildEvolutionGuide() {
    const guide = document.getElementById("evolution-line");
    guide.innerHTML = "";
    const maxRadius = MOTSU_TYPES[MOTSU_TYPES.length - 1].radius;
    
    MOTSU_TYPES.forEach(m => {
        const item = document.createElement("div");
        item.className = "evo-item";
        
        const displaySize = Math.max(6, (m.radius / maxRadius) * 20);
        
        const circle = document.createElement("div");
        circle.className = "evo-circle";
        circle.style.width = `${displaySize}px`;
        circle.style.height = `${displaySize}px`;
        
        if (m.image) {
            circle.style.backgroundImage = `url(${m.image}?v=${cacheBuster})`;
        } else {
            circle.style.backgroundColor = m.color;
        }
        
        const name = document.createElement("span");
        name.className = "evo-name";
        name.innerText = m.name;
        
        item.appendChild(circle);
        item.appendChild(name);
        guide.appendChild(item);
    });
}

function drawNext() {
    nextCtx.clearRect(0, 0, 50, 50);
    const nextType = MOTSU_TYPES[nextMotsuIndex];
    const r = Math.min(16, nextType.radius * 0.8);

    nextCtx.save();
    nextCtx.beginPath();
    nextCtx.arc(25, 25, r, 0, 2 * Math.PI);
    nextCtx.closePath();
    nextCtx.clip();

    if (nextType.imgElement && nextType.imgElement.complete && nextType.imgElement.naturalWidth !== 0) {
        nextCtx.drawImage(nextType.imgElement, 25 - r, 25 - r, r * 2, r * 2);
    } else {
        nextCtx.fillStyle = nextType.color;
        nextCtx.fill();
    }

    nextCtx.restore();

    nextCtx.strokeStyle = "#fff";
    nextCtx.lineWidth = 1.5;
    nextCtx.beginPath();
    nextCtx.arc(25, 25, r, 0, 2 * Math.PI);
    nextCtx.stroke();
}

function drawMotsu(context, x, y, radius, angle, type, alpha = 1.0) {
    context.save();
    context.translate(x, y);
    context.rotate(angle);
    context.globalAlpha = alpha;

    context.beginPath();
    context.arc(0, 0, radius, 0, 2 * Math.PI);
    context.closePath();
    context.clip();

    if (type.imgElement && type.imgElement.complete && type.imgElement.naturalWidth !== 0) {
        context.drawImage(type.imgElement, -radius, -radius, radius * 2, radius * 2);
    } else {
        context.fillStyle = type.color;
        context.fill();
    }

    context.restore();

    context.save();
    context.translate(x, y);
    context.globalAlpha = alpha;
    context.strokeStyle = "#231815";
    context.lineWidth = 2.5;
    context.beginPath();
    context.arc(0, 0, radius, 0, 2 * Math.PI);
    context.stroke();

    if (!type.imgElement || !type.imgElement.complete || type.imgElement.naturalWidth === 0) {
        context.rotate(angle);
        context.fillStyle = (type.color === "#f5f6fa" || type.color === "#fff200" || type.color === "#ffaaa6") ? "#231815" : "#fff";
        context.font = `bold ${Math.max(9, radius * 0.42)}px sans-serif`;
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(type.name, 0, 0);
    }

    context.restore();
}

function renderLoop() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    ctx.strokeStyle = "rgba(230, 126, 34, 0.4)";
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, DEAD_LINE);
    ctx.lineTo(WIDTH, DEAD_LINE);
    ctx.stroke();
    ctx.setLineDash([]);

    const bodies = Composite.allBodies(world);
    bodies.forEach(body => {
        if (body.isStatic) return;
        const type = body.motsuType;
        if (!type) return;

        drawMotsu(ctx, body.position.x, body.position.y, type.radius, body.angle, type);
    });

    if (isReadyToDrop && !gameOver) {
        const currentType = MOTSU_TYPES[currentMotsuIndex];
        drawMotsu(ctx, previewX, DEAD_LINE - 25, currentType.radius, 0, currentType, 0.8);
        
        ctx.strokeStyle = "rgba(35, 24, 21, 0.1)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(previewX, DEAD_LINE - 25);
        ctx.lineTo(previewX, HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    if (!gameOver) {
        requestAnimationFrame(renderLoop);
    }
}

function updatePreviewPosition(clientX) {
    if (!isReadyToDrop || gameOver) return;
    const rect = canvas.getBoundingClientRect();
    previewX = clientX - rect.left;
    
    const r = MOTSU_TYPES[currentMotsuIndex].radius;
    if (previewX < r) previewX = r;
    if (previewX > WIDTH - r) previewX = WIDTH - r;
}

canvas.addEventListener("mousemove", (e) => updatePreviewPosition(e.clientX));
canvas.addEventListener("click", () => { 
    initAudio();
    if(isReadyToDrop && !gameOver) dropMotsu(); 
});

canvas.addEventListener("touchmove", (e) => {
    updatePreviewPosition(e.touches[0].clientX);
    e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend", () => { 
    initAudio();
    if(isReadyToDrop && !gameOver) dropMotsu(); 
});

function dropMotsu() {
    isReadyToDrop = false;
    playDropSound();

    const type = MOTSU_TYPES[currentMotsuIndex];
    
    const motsu = Bodies.circle(previewX, DEAD_LINE - 25, type.radius, {
        restitution: MOTSU_PHYSICS.restitution,
        friction: MOTSU_PHYSICS.friction,
        density: MOTSU_PHYSICS.density
    });
    
    motsu.motsuType = type;
    motsu.spawnTime = Date.now();
    motsu.lockTimer = 0;

    Composite.add(world, motsu);

    currentMotsuIndex = nextMotsuIndex;
    nextMotsuIndex = getRandomMotsuIndex();
    drawNext();

    setTimeout(() => {
        isReadyToDrop = true;
        updatePreviewPosition(previewX);
    }, 600);
}

// --- 合体ロジック ＆ カウント機能 ---
Events.on(engine, 'collisionStart', (event) => {
    const pairs = event.pairs;
    
    pairs.forEach(pair => {
        const bodyA = pair.bodyA;
        const bodyB = pair.bodyB;

        if (bodyA.motsuType && bodyB.motsuType && bodyA.motsuType.name === bodyB.motsuType.name) {
            if (bodyA.isDead || bodyB.isDead) return;

            const currentIndex = MOTSU_TYPES.findIndex(m => m.name === bodyA.motsuType.name);
            
            // 最大サイズ「ツル」同士の合体
            if (currentIndex === MOTSU_TYPES.length - 1) {
                score += 100;
                document.getElementById("score-val").innerText = score;
                playMergeSound(currentIndex + 2);
                bodyA.isDead = true; bodyB.isDead = true;
                Composite.remove(world, [bodyA, bodyB]);
                return;
            }

            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;
            const nextType = MOTSU_TYPES[currentIndex + 1];

            // 実績のカウントアップ（ツル、コブクロ、テッポウ、カシラ）
            if (nextType.name === "ツル") {
                tsuruCreatedCount++;
            } else if (nextType.name === "コブクロ") {
                kobukuroCreatedCount++;
            } else if (nextType.name === "テッポウ") {
                teppouCreatedCount++;
            } else if (nextType.name === "カシラ") {
                kashiraCreatedCount++;
            }

            bodyA.isDead = true;
            bodyB.isDead = true;

            Composite.remove(world, [bodyA, bodyB]);

            const upgraded = Bodies.circle(midX, midY, nextType.radius, {
                restitution: MOTSU_PHYSICS.restitution,
                friction: MOTSU_PHYSICS.friction,
                density: MOTSU_PHYSICS.density
            });
            upgraded.motsuType = nextType;
            upgraded.spawnTime = Date.now();
            upgraded.lockTimer = 0;

            Composite.add(world, upgraded);

            score += nextType.score;
            document.getElementById("score-val").innerText = score;

            playMergeSound(currentIndex + 1);
        }
    });
});

// --- ラインオーバー判定 ---
Events.on(engine, 'afterUpdate', () => {
    if (gameOver) return;
    
    const bodies = Composite.allBodies(world);
    let triggerGameOver = false;

    bodies.forEach(body => {
        if (body.isStatic) return;
        
        const topY = body.position.y - body.motsuType.radius;
        
        if (topY < DEAD_LINE) {
            if (Date.now() - body.spawnTime > 3000) { 
                if (body.speed < 0.15) {
                    body.lockTimer += 1;
                    if (body.lockTimer > 90) { // 1.5秒間動かず停止した場合
                        triggerGameOver = true;
                    }
                } else {
                    body.lockTimer = 0; 
                }
            }
        } else {
            body.lockTimer = 0;
        }
    });

    if (triggerGameOver) {
        gameOverAction();
    }
});

// --- リザルト画面表示 ---
function gameOverAction() {
    if (gameOver) return;
    gameOver = true;
    stopBGM();
    playGameOverSound();
    
    // スコア＆各カウントの反映
    document.getElementById("modal-score-val").innerText = score;
    document.getElementById("tsuru-count").innerText = `${tsuruCreatedCount}個`;
    document.getElementById("kobukuro-count").innerText = `${kobukuroCreatedCount}個`;
    document.getElementById("teppou-count").innerText = `${teppouCreatedCount}個`;
    document.getElementById("kashira-count").innerText = `${kashiraCreatedCount}個`;
    
    // ダイアログを表示
    const modal = document.getElementById("game-over-modal");
    modal.style.display = "flex";
}

// リトライ処理
function retryGame() {
    location.reload();
}

init();
</script>
