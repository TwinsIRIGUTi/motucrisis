<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>モツモツクライシス</title>
    <style>
        :root { --bg-color: #1a0000; --gold: #fff000; }
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: var(--bg-color);
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #game-wrapper {
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        #game-screen {
            position: relative;
            width: 360px;
            height: 500px;
            background: #222;
            border: 4px solid #440000;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 10px;
        }
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s; z-index: 1; pointer-events: none;
        }
        .bg-active { opacity: 1; }
        #bg-danger {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('./images/background_danger.png');
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 0.3s; z-index: 2; pointer-events: none;
        }
        .danger-active { opacity: 1 !important; animation: pulseDanger 0.8s infinite alternate; }
        @keyframes pulseDanger { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: red; opacity: 0; pointer-events: none; z-index: 50;
            transition: opacity 0.2s;
        }
        #player {
            position: absolute; bottom: 10px; width: 70px; height: 70px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 10;
        }
        .falling-item {
            position: absolute; width: 55px; height: 55px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 5;
        }
        .fast-mode { filter: drop-shadow(0 0 12px #ff0000) brightness(1.3); }
        .twins-effect { filter: drop-shadow(0 0 15px #fffacd) brightness(1.3); animation: twinsGlow 1s ease-in-out infinite; }
        @keyframes twinsGlow { 0%, 100% { filter: drop-shadow(0 0 10px #fffacd); } 50% { filter: drop-shadow(0 0 20px #ffeb3b); } }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            background-image: url('./images/title_bg.png');
            background-size: cover; background-position: center;
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .crisis-title-container { margin-bottom: 5px; perspective: 500px; }
        .title-part { font-family: 'Arial Black', sans-serif; font-weight: 900; font-style: italic; display: block; line-height: 0.8; }
        .title-motsu { font-size: 40px; color: #fff; text-shadow: 0 2px 0 #888, 0 4px 5px rgba(0,0,0,0.5); }
        .title-crisis { font-size: 44px; color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        
        .how-to-play { font-size: 10px; background: rgba(0,0,0,0.75); padding: 6px; border-radius: 8px; margin: 5px 0; border: 1px solid #444; width: 95%; line-height: 1.3; text-align: left; }
        .how-to-play b { color: #ff0; }
        
        .selector-label { font-size: 13px; margin-top: 3px; color: #ccc; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 5px; }
        .mode-btn { padding: 4px 12px; background: #333; border: 2px solid #555; color: #fff; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .mode-btn.selected { border-color: #ff0000; background: #600; }

        .char-selector { display: flex; gap: 8px; margin: 3px 0; }
        .char-btn { width: 45px; height: 45px; border: 3px solid #555; border-radius: 10px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: rgba(255,255,255,0.1); cursor: pointer; }
        .char-btn.selected { border-color: #ff0000; background-color: rgba(255,0,0,0.3); box-shadow: 0 0 10px #ff0000; }

        .sound-switch { background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; margin-bottom: 5px; border: 1px solid #777; font-size: 11px; cursor: pointer; }
        .action-btn { padding: 10px 25px; font-size: 18px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: #aa0000; border-bottom: 4px solid #660000; outline: none; z-index: 101; }
        
        #ui-layer { position: absolute; top: 8px; width: 100%; display: flex; justify-content: space-around; color: white; font-weight: bold; text-shadow: 2px 2px #000; z-index: 20; pointer-events: none; font-size: 13px; }
        .controls-row { display: flex; gap: 15px; align-items: center; margin-top: 10px; }
        .btn { width: 100px; height: 65px; font-size: 26px; color: white; background: #880000; border: none; border-bottom: 5px solid #440000; border-radius: 12px; cursor: pointer; touch-action: none; outline: none; }
        .pause-btn { width: 75px; height: 65px; font-size: 13px; background: #555; border-bottom-color: #333; }
        #result-screen { display: none; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-screen">
            <!-- 背景レイヤー -->
            <div id="bg-container">
                <div class="bg-layer bg-active" style="background-image: url('./images/background1.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background2.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background3.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background4.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background5.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background6.png');"></div>
                <div class="bg-layer" style="background-image: url('./images/background7.png');"></div>
            </div>
            <div id="bg-danger"></div>
            <div id="damage-flash"></div>

            <!-- タイトル画面 -->
            <div id="title-screen" class="overlay">
                <div class="crisis-title-container">
                    <span class="title-part title-motsu">モツモツ</span>
                    <span class="title-part title-crisis">クライシス</span>
                </div>
                <div id="best-info" style="font-size:12px; margin-bottom:3px; color:var(--gold);">
                    最高記録: <span id="best-score-text">0</span> 点 (<span id="best-shogo-text">いちげんさん</span>)
                </div>
                <div class="how-to-play">
                    ・左右移動でモツをキャッチせよ！<br>
                    ・<b>赤オーラ</b>: 3倍速個体（50点） / <b>梅割り</b>: 体力回復<br>
                    ・<b>bottle・shoe</b>: ダメージ（コンボは途切れません）<br>
                    ・<b>twins(超レア)</b>: 体力最大回復＆1000点！
                </div>
                <div class="selector-label">難易度：</div>
                <div class="mode-selector">
                    <button class="mode-btn" id="mode-easy" data-mode="easy">イージー</button>
                    <button class="mode-btn selected" id="mode-hard" data-mode="hard">ハード</button>
                </div>
                <div class="selector-label">呑んべぇ（キャラクター）：</div>
                <div class="char-selector">
                    <div class="char-btn selected" data-char="A" style="background-image:url('./images/playerA1.png')"></div>
                    <div class="char-btn" data-char="B" style="background-image:url('./images/playerB1.png')"></div>
                    <div class="char-btn" data-char="C" style="background-image:url('./images/playerC1.png')"></div>
                    <div class="char-btn" data-char="D" style="background-image:url('./images/playerD1.png')"></div>
                </div>
                <div class="sound-switch" id="sound-toggle">音設定: <span class="sound-status-text">ON</span></div>
                <button class="action-btn" id="start-btn">宴 開始</button>
            </div>

            <!-- リザルト画面 -->
            <div id="result-screen" class="overlay">
                <h1 style="color:#ff0000; font-size:36px; margin:0 0 10px 0;">宴 終 了</h1>
                <div id="final-score" style="font-size:22px; margin:10px 0; color:var(--gold);">0 点</div>
                <div id="final-shogo" style="font-size:16px; margin-bottom:15px; font-weight:bold;">称号: いちげんさん</div>
                <button class="action-btn" id="retry-btn" style="width:220px;">もう一杯！（戻る）</button>
            </div>

            <!-- ゲーム中UI -->
            <div id="ui-layer">
                <div id="hp-display">体力: ❤️❤️❤️</div>
                <div id="score-board">0点</div>
                <div id="chain-display">連続: 0</div>
            </div>

            <div id="player"></div>
        </div>

        <!-- 操作ボタン -->
        <div class="controls-row">
            <button class="btn" id="left-btn">◀</button>
            <button class="btn pause-btn" id="pause-btn">一時停止</button>
            <button class="btn" id="right-btn">▶</button>
        </div>
    </div>

    <script>
        (function() {
            let soundEnabled = true, isPaused = false, isGameRunning = false;
            let selectedChar = 'A', selectedMode = 'hard';
            let score = 0, hp = 3, chain = 0, playerX = 145;
            let moveDir = 0, playerSpeed = 7;
            let gameInterval = null, timerTicks = 0;
            let items = [];
            let currentBgIndex = 0, bgTimer = 0;
            let animTick = 0;

            // 音声ファイル管理
            const bgmFiles = [
                './audio/bgm1.mp3', './audio/bgm2.mp3', './audio/bgm3.mp3',
                './audio/bgm4.mp3', './audio/bgm5.mp3', './audio/bgm6.mp3', './audio/bgm7.mp3'
            ];
            let currentBgm = null;

            const sfx = {
                damage: new Audio('./audio/damage.mp3'),
                get: new Audio('./audio/get.mp3'),
                heal: new Audio('./audio/heal.mp3'),
                move: new Audio('./audio/move.mp3'),
                selectA: new Audio('./audio/selectA.mp3'),
                selectB: new Audio('./audio/selectB.mp3'),
                selectC: new Audio('./audio/selectC.mp3'),
                selectD: new Audio('./audio/selectD.mp3'),
                siren: new Audio('./audio/siren.mp3'),
                twins: new Audio('./audio/twins.mp3')
            };
            sfx.siren.loop = true;

            function playSfx(name) {
                if (!soundEnabled) return;
                const sound = sfx[name];
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            }

            function playRandomBgm() {
                if (!soundEnabled) return;
                if (currentBgm) {
                    currentBgm.pause();
                    currentBgm.currentTime = 0;
                }
                const randomBgmPath = bgmFiles[Math.floor(Math.random() * bgmFiles.length)];
                currentBgm = new Audio(randomBgmPath);
                currentBgm.loop = true;
                currentBgm.volume = 0.3;
                currentBgm.play().catch(() => {});
            }

            function stopAllSound() {
                if (currentBgm) { currentBgm.pause(); currentBgm.currentTime = 0; }
                Object.values(sfx).forEach(s => { s.pause(); s.currentTime = 0; });
            }

            // モツ画像リスト
            const motsuImages = [
                './images/shiro.png', './images/lever.png', './images/gatsu.png',
                './images/hatsu.png', './images/kasira.png', './images/abura.png', './images/nankotsu.png'
            ];

            // UI操作イベント
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedMode = btn.dataset.mode;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });

            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedChar = btn.dataset.char;
                    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    playSfx(`select${selectedChar}`);
                });
            });

            document.getElementById('sound-toggle').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.querySelectorAll('.sound-status-text').forEach(el => el.innerText = soundEnabled ? "ON" : "OFF");
                if (!soundEnabled) {
                    stopAllSound();
                } else if (isGameRunning && !isPaused) {
                    playRandomBgm();
                    if (hp === 1) sfx.siren.play().catch(()=>{});
                }
            });

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('retry-btn').addEventListener('click', () => location.reload());
            document.getElementById('pause-btn').addEventListener('click', togglePause);

            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');

            leftBtn.addEventListener('pointerdown', () => { moveDir = -1; });
            leftBtn.addEventListener('pointerup', () => { if(moveDir === -1) moveDir = 0; });
            leftBtn.addEventListener('pointercancel', () => { if(moveDir === -1) moveDir = 0; });

            rightBtn.addEventListener('pointerdown', () => { moveDir = 1; });
            rightBtn.addEventListener('pointerup', () => { if(moveDir === 1) moveDir = 0; });
            rightBtn.addEventListener('pointercancel', () => { if(moveDir === 1) moveDir = 0; });

            function togglePause() {
                if (!isGameRunning) return;
                isPaused = !isPaused;
                document.getElementById('pause-btn').innerText = isPaused ? "再開" : "一時停止";
                if (isPaused) {
                    if (currentBgm) currentBgm.pause();
                    sfx.siren.pause();
                } else {
                    if (soundEnabled) {
                        if (currentBgm) currentBgm.play().catch(()=>{});
                        if (hp === 1) sfx.siren.play().catch(()=>{});
                    }
                }
            }

            function startGame() {
                isGameRunning = true;
                document.getElementById('title-screen').style.display = 'none';
                loadBestScore();
                playRandomBgm();
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(updateGame, 20);
            }

            function loadBestScore() {
                const bScore = localStorage.getItem('motu_best_score') || 0;
                document.getElementById('best-score-text').innerText = bScore;
                document.getElementById('best-shogo-text').innerText = getShogo(bScore);
            }

            function getShogo(sc) {
                if (sc >= 15000) return 'レジェンド';
                if (sc >= 5000) return '常連さん';
                if (sc >= 2500) return 'お客さん';
                if (sc >= 1000) return '御新規さん';
                return 'いちげんさん';
            }

            function handleSpawns() {
                const intervalMotsu = selectedMode === 'hard' ? 35 : 55;
                const intervalEnemy = selectedMode === 'hard' ? 70 : 100;
                const intervalHeal = 400;
                const intervalTwins = 1200;

                if (timerTicks % intervalMotsu === 0) {
                    const isFast = Math.random() < 0.2;
                    spawnItem(isFast ? 'motsu_fast' : 'motsu');
                }
                if (timerTicks % intervalEnemy === 0) {
                    const enemyType = Math.random() < 0.5 ? 'bottle' : 'shoe';
                    spawnItem(enemyType);
                }
                if (timerTicks % intervalHeal === 0) {
                    spawnItem('umewari');
                }
                if (timerTicks % intervalTwins === 0) {
                    spawnItem('twins');
                }
            }

            function spawnItem(type) {
                const screen = document.getElementById('game-screen');
                const itemEl = document.createElement('div');
                itemEl.className = 'falling-item';
                
                let speed = 3.5;
                if (type === 'motsu_fast') { speed = 10.5; itemEl.classList.add('fast-mode'); }
                if (type === 'bottle') speed = 8.0;
                if (type === 'shoe') speed = 6.5;
                if (type === 'twins') { speed = 5.0; itemEl.classList.add('twins-effect'); }

                const x = Math.random() * 305;
                itemEl.style.left = x + 'px';
                itemEl.style.top = '-55px';

                if (type.startsWith('motsu')) {
                    const randomMotsu = motsuImages[Math.floor(Math.random() * motsuImages.length)];
                    itemEl.style.backgroundImage = `url('${randomMotsu}')`;
                } else if (type === 'bottle') {
                    itemEl.style.backgroundImage = "url('./images/bottle.png')";
                } else if (type === 'shoe') {
                    itemEl.style.backgroundImage = "url('./images/shoe.png')";
                } else if (type === 'umewari') {
                    itemEl.style.backgroundImage = "url('./images/umewari.png')";
                } else if (type === 'twins') {
                    itemEl.style.backgroundImage = "url('./images/twins.png')";
                }

                screen.appendChild(itemEl);
                items.push({ el: itemEl, x: x, y: -55, type: type, speed: speed, wobble: Math.random() * 10 });
            }

            function updateGame() {
                if (isPaused) return;
                timerTicks++;
                animTick++;

                bgTimer++;
                if (bgTimer >= 1500) {
                    bgTimer = 0;
                    currentBgIndex = (currentBgIndex + 1) % 7;
                    document.querySelectorAll('.bg-layer').forEach((el, idx) => {
                        el.classList.toggle('bg-active', idx === currentBgIndex);
                    });
                }

                handleSpawns();

                playerX += moveDir * playerSpeed;
                if (playerX < 0) playerX = 0;
                if (playerX > 290) playerX = 290;
                
                const pEl = document.getElementById('player');
                pEl.style.left = playerX + 'px';
                let frameNum = (Math.floor(animTick / 10) % 2) + 1;
                pEl.style.backgroundImage = `url('./images/player${selectedChar}${frameNum}.png')`;

                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i];
                    it.y += it.speed;
                    
                    if (it.type === 'shoe') {
                        it.wobble += 0.1;
                        it.x += Math.sin(it.wobble) * 2;
                    }
                    it.el.style.top = it.y + 'px';
                    it.el.style.left = it.x + 'px';

                    if (it.y > 410 && it.y < 470 && it.x + 45 > playerX && it.x < playerX + 55) {
                        if (it.type === 'motsu' || it.type === 'motsu_fast') {
                            let addScore = (it.type === 'motsu_fast') ? 50 : 10;
                            chain++;
                            let bonus = Math.floor(chain / 10) * 5;
                            score += addScore + bonus;
                            playSfx('get');
                        } else if (it.type === 'umewari') {
                            hp = Math.min(3, hp + 1);
                            score += 200;
                            playSfx('heal');
                            updateUI();
                        } else if (it.type === 'twins') {
                            hp = 3;
                            score += 1000;
                            playSfx('twins');
                            updateUI();
                        } else if (it.type === 'bottle' || it.type === 'shoe') {
                            hp--;
                            triggerDamageFlash();
                            playSfx('damage');
                            updateUI();
                            if (hp <= 0) {
                                gameOver();
                                return;
                            }
                        }
                        it.el.remove();
                        items.splice(i, 1);
                        updateUI();
                    } else if (it.y > 500) {
                        if (it.type === 'motsu' || it.type === 'motsu_fast') {
                            chain = 0;
                        }
                        it.el.remove();
                        items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            function triggerDamageFlash() {
                const flash = document.getElementById('damage-flash');
                flash.style.opacity = '0.7';
                setTimeout(() => flash.style.opacity = '0', 200);
            }

            function updateUI() {
                document.getElementById('score-board').innerText = score + '点';
                document.getElementById('chain-display').innerText = '連続: ' + chain;
                
                let hearts = '';
                for (let i = 0; i < hp; i++) hearts += '❤️';
                document.getElementById('hp-display').innerText = '体力: ' + hearts;

                const dangerEl = document.getElementById('bg-danger');
                if (hp === 1) {
                    dangerEl.classList.add('danger-active');
                    if (soundEnabled && sfx.siren.paused) sfx.siren.play().catch(()=>{});
                } else {
                    dangerEl.classList.remove('danger-active');
                    sfx.siren.pause();
                    sfx.siren.currentTime = 0;
                }
            }

            function gameOver() {
                isGameRunning = false;
                clearInterval(gameInterval);
                stopAllSound();
                items.forEach(it => it.el.remove());
                items = [];

                const best = localStorage.getItem('motu_best_score') || 0;
                if (score > best) {
                    localStorage.setItem('motu_best_score', score);
                }

                document.getElementById('final-score').innerText = score + ' 点';
                document.getElementById('final-shogo').innerText = '称号: ' + getShogo(score);
                document.getElementById('result-screen').style.display = 'flex';
            }
        })();
    </script>
</body>
</html>
